# Bundle patch for @local/dsh-compaction-force.
#
# TEMPLATE — do not install this file unchanged. The row mounts the host plugin
# by an absolute path, so a path must be substituted first:
#
#   node scripts/prepare-patch.mjs /abs/path/to/dsh-compaction-force/index.js
#
# prints the ready-to-use patch on stdout (or write it with `--out <file>`).
# The generated row must then be mounted inside the compaction isolate group of
# a disposable profile test; a full DSH restart of that profile is required for
# it to take effect.
#
# Mounting rules:
# - The row MUST sit inside the compaction isolate group (the `compaction`
#   service is isolated there), such as a target DSH web preset (`standard`,
#   `ptc`, `minimal`, `cordis`) or a custom preset cloned for A/B testing.
# - Applied at a PROFILE ROOT this patch is INERT in the web profile (its root
#   compaction-basic row is disabled) and only meaningful in a profile whose
#   root engine exists, e.g. the headless harness.
# - `forceAtTokens` 262144 / `minContextWindow` 500000: models above a 500K
#   window get a per-model thresholdRatio = 262144 / contextWindow, i.e.
#   pressure compaction fires at ~256K tokens.
- insert:
    - id: compaction-force
      name: /path/to/dsh-compaction-force/index.js  # replaced by prepare-patch
      config:
        forceAtTokens: 262144
        minContextWindow: 500000
        note: handoff
